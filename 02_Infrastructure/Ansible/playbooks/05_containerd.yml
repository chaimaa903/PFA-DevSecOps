---
- name: Configuration de containerd pour Kubernetes
  hosts: all
  become: true

  tasks:

    - name: Créer répertoire config containerd
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Supprimer ancienne configuration containerd
      file:
        path: /etc/containerd/config.toml
        state: absent

    - name: Générer la configuration par défaut
      shell: |
        containerd config default > /etc/containerd/config.toml

    - name: Configurer SystemdCgroup dans containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Redémarrer containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Vérifier containerd actif
      systemd:
        name: containerd
        state: started

    - name: Afficher statut containerd
      command: systemctl is-active containerd
      register: containerd_status

    - name: Résultat containerd
      debug:
        msg: "containerd status : {{ containerd_status.stdout }}"
