---
- name: Prérequis Kubernetes #es 3 VM pour accueillir Kubernetes avec Ansible.
  hosts: all
  become: true

  tasks:

    - name: Désactiver le swap immédiatement
      command: swapoff -a

    - name: Désactiver le swap au démarrage
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Vérifier que swap est désactivé
      command: swapon --show
      register: swap_status

    - name: Afficher statut swap
      debug:
        msg: "Swap désactivé : {{ swap_status.stdout == '' }}"

    - name: Charger modules kernel nécessaires
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Rendre les modules permanents
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf

    - name: Configurer les paramètres sysctl pour Kubernetes
      copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf

    - name: Appliquer les paramètres sysctl
      command: sysctl --system

    